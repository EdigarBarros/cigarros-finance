<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090d18" />
<title>OpusCash: sem internet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(circle at 50% 30%, #12203a 0%, #090d18 60%); color: #e8ecf6;
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
  }
  main { max-width: 360px; }
  img { width: 96px; height: auto; margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0 0 10px; font-weight: 700; }
  p { margin: 0 0 28px; color: #9aa6c0; line-height: 1.5; }
  a {
    display: inline-block; padding: 13px 26px; border-radius: 999px; text-decoration: none; font-weight: 600; color: #fff;
    background: linear-gradient(90deg, #4f46e5, #2563eb, #14b8a6);
  }
</style>
</head>
<body>
<main>
  <img src="/simbolo.webp" alt="OpusCash" />
  <h1 id="titulo">Você está sem internet</h1>
  <p id="texto">O OpusCash precisa de conexão para mostrar seus dados. Seus lançamentos continuam guardados.</p>
  <a id="botao" href="/">Tentar de novo</a>
</main>
<script src="/offline.js"></script>
</body>
</html>
