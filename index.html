<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpusCash</title>
    <meta name="description" content="OpusCash — seu dinheiro organizado: entradas, saídas, metas e contas num painel só" />
    <meta name="theme-color" content="#090d18" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- abre como app em tela cheia quando adicionado à Tela de Início do iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpusCash" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- aplica o tema salvo antes da primeira pintura, para a tela não piscar no tema errado -->
    <script>
      try {
        var t = localStorage.getItem('opuscash-tema')
        if (t !== 'claro' && t !== 'escuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
        document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
    <link rel="preload" as="image" href="/simbolo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
