<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OpusCash Reels</title>
<style>
  :root {
    --fundo: #070b14; --texto: #eef2fa; --texto-2: rgba(203, 213, 235, .7);

  * { box-sizing: border-box; }

    background-size: 120px 120px; transform: rotateX(72deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 75%); mask-image: linear-gradient(to top, #000 10%, transparent 75%); }
  .tel { position: absolute; left: 0; top: 0; width: 430px; height: 932px; transform-origin: 0 0; transform-style: preserve-3d; will-change: transform; }
  .chapa { position: absolute; inset: 0; border-radius: 44px; background: #0b1222; border: 2px solid rgba(120, 150, 220, .18); }
  .base { position: absolute; inset: 0; border-radius: 40px; background-repeat: no-repeat; background-size: 430px auto;

  .carta { position: absolute; border-radius: 18px; background-repeat: no-repeat; background-size: 430px auto; overflow: hidden; }
  .carta .brilho { position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); }
  .carta .revela { position: absolute; background-repeat: no-repeat; background-size: 430px auto; }
  .carta svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .peca { position: absolute; background-size: 100% 100%; }
  .etiqueta { position: absolute; white-space: nowrap; font: 700 15px 'Inter'; color: #1b1405; background: var(--divida);
    padding: 7px 12px; border-radius: 999px; box-shadow: 0 8px 26px rgba(255, 194, 75, .45); }
  .veu { position: absolute; left: 0; right: 0; top: 0; height: 640px; background: linear-gradient(rgba(7,11,20,.96) 0, rgba(7,11,20,.9) 55%, rgba(7,11,20,0)); }
  .legenda { text-shadow: 0 4px 30px rgba(0,0,0,.7); position: absolute; left: 0; right: 0; top: 196px; text-align: center; padding: 0 70px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; font: 700 30px 'Inter'; letter-spacing: .06em; text-transform: uppercase;
    padding: 10px 26px; border-radius: 999px; color: #fff; background: var(--gradiente); box-shadow: 0 10px 40px rgba(31, 142, 241, .4); }
  .legenda h1 { margin: 26px 0 0; font-size: 78px; white-space: nowrap; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  .legenda p { margin: 18px 0 0; font: 500 40px/1.25 'Inter'; color: var(--texto-2); }
  .grad { background: var(--gradiente); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gancho { position: absolute; left: 0; right: 0; top: 560px; text-align: center; transform-style: preserve-3d; }
  .gancho div { font-size: 128px; font-weight: 800; line-height: 1.08; letter-spacing: -.03em; transform-origin: 50% 100%; }
  .anel { position: absolute; left: 540px; top: 1060px; transform-style: preserve-3d; }
  .mini { position: absolute; left: -215px; top: -466px; width: 430px; height: 932px; border-radius: 40px; background-size: 430px auto;
    background-repeat: no-repeat; box-shadow: 0 0 0 2px rgba(148, 163, 196, .25), 0 30px 80px rgba(0, 0, 0, .6); }
  .mini i { position: absolute; left: 14px; top: 856px; width: 402px; height: 64px; background-size: 100% 100%; }
  .fim { position: absolute; left: 0; right: 0; top: 560px; text-align: center; }
  .fim img { width: 760px; }
  .fim h2 { margin: 30px 0 0; font-size: 64px; font-weight: 800; letter-spacing: -.02em; }
  .fim .cta { display: inline-block; margin-top: 54px; font: 800 52px 'Inter'; padding: 30px 64px; border-radius: 999px; color: #fff;
    background: var(--gradiente); box-shadow: 0 20px 70px rgba(20, 201, 160, .45); }
  .fim .site { margin-top: 36px; font: 600 46px 'Inter'; color: var(--texto); letter-spacing: .01em; }
</style>
</head>
<body>
<div id="palco">
  <div class="orbe" id="oa" style="width:1100px;height:1100px;background:radial-gradient(circle, var(--marca-1), transparent 65%)"></div>
  <div class="orbe" id="ob" style="width:1000px;height:1000px;background:radial-gradient(circle, var(--marca-3), transparent 65%)"></div>
  <div class="orbe" id="oc" style="width:800px;height:800px;background:radial-gradient(circle, var(--marca-2), transparent 65%)"></div>
  <div class="grade" id="grade"></div>
</div>
<script src="dados.js"></script>
<script>
const CX = 540, CY = 1090, SW = 430, SH = 932, TOPO = 60
const palco = document.getElementById('palco')
const limitar = (n, a = 0, b = 1) => Math.min(b, Math.max(a, n))
const rampa = (a, b, x) => limitar((x - a) / (b - a))
const suave = (a, b, x) => { const t = rampa(a, b, x); return t * t * t * (t * (t * 6 - 15) + 10) }
const mistura = (a, b, t) => a + (b - a) * t
const el = (tag, cls, pai, estilo = {}) => { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e.style, estilo); pai && pai.appendChild(e); return e }
const img = (n) => `url(cap/${n}.png)`

/** Hermite monotônica (a mesma curva da câmera da página inicial): passa pelos pontos sem parar em cada um. */
function curva(ps, vs) {
  const n = ps.length
  if (n === 1) return () => vs[0]
  const d = ps.slice(0, -1).map((_, i) => (vs[i + 1] - vs[i]) / (ps[i + 1] - ps[i]))
  const m = ps.map((_, i) => (i === 0 || i === n - 1 || d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2))
  d.forEach((di, i) => {
    if (di === 0) { m[i] = 0; m[i + 1] = 0; return }
    const a = m[i] / di, b = m[i + 1] / di, h = a * a + b * b
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * di; m[i + 1] = t * b * di }
  })
  return (p) => {
    if (p <= ps[0]) return vs[0]
    if (p >= ps[n - 1]) return vs[n - 1]
    let i = 0
    while (i < n - 2 && p > ps[i + 1]) i++
    const h = ps[i + 1] - ps[i], t = limitar((p - ps[i]) / h), t2 = t * t, t3 = t2 * t
    return (2 * t3 - 3 * t2 + 1) * vs[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * vs[i + 1] + (t3 - t2) * h * m[i + 1]
  }
}
const PROPS = ['s', 'rx', 'ry', 'rz', 'fx', 'fy', 'sc', 'oy']
const PADRAO = { s: 1.4, rx: 10, ry: 0, rz: 0, fx: SW / 2, fy: SH / 2, sc: 0, oy: 0 }
function camera(quadros) {
  let atual = { ...PADRAO }
  const cheios = quadros.map((q) => (atual = { ...atual, ...q }))
  const ts = cheios.map((q) => q.t), f = {}
  PROPS.forEach((k) => (f[k] = curva(ts, cheios.map((q) => q[k]))))
  return (t) => Object.fromEntries(PROPS.map((k) => [k, f[k](t)]))
}

/* ───────────── Roteiro ───────────── */
// lift: [índice do cartão na tela, sobe em, desce em, altura]. Cartões vêm de META (posições reais na tela do app).
const CENAS = [
  { pg: 'inicio', ini: 3.6, fim: 8.6, entrada: 'baixo',
    leg: [{ a: 0, chip: 'Início', h: 'Tudo num relance', p: 'Entrou, saiu e sobrou. Logo ao abrir.' }],
    cam: [{ t: 0, s: 1.05, rx: 42, ry: 0, rz: -10 }, { t: 1.1, s: 1.38, rx: 18, ry: -24, rz: 3 }, { t: 2.6, s: 1.42, rx: 16, ry: -30, rz: 4, fy: 430 },
      { t: 3.0, sc: 0 }, { t: 3.8, sc: 680, rx: 12, ry: 14, rz: -2, fy: 470 }, { t: 5, s: 1.45, rx: 9, ry: 20, rz: -2 }],
    lift: [[0, .8, 3.0, 170], [1, .9, 3.05, 240], [2, 1.0, 3.1, 210], [3, 1.1, 3.15, 290], [4, 1.2, 3.2, 150], [5, 1.3, 3.25, 230], [6, 1.4, 3.3, 190],
      [7, 3.7, 6, 110], [8, 3.95, 6, 160]] },
  { pg: 'lancamentos', ini: 8.6, fim: 13.0,
    leg: [{ a: 0, chip: 'Lançamentos', h: 'Cada gasto no lugar', p: 'Separado por categoria, dia a dia.' }],
    cam: [{ t: 0, s: 1.4, rx: 10, ry: -18, rz: 2 }, { t: 1.8, s: 1.48, rx: 12, ry: -26, rz: 3 }, { t: 2.3, sc: 0 }, { t: 3.1, sc: 620, ry: 10 }, { t: 4.4, s: 1.5, rx: 8, ry: 18, rz: -1 }],
    lift: [[4, .45, 2.3, 150], [2, .8, 2.4, 100], [3, 2.8, 6, 150]] },
  { pg: 'contas', ini: 13.0, fim: 17.6,
    leg: [{ a: 0, chip: 'Contas do mês', h: 'Nada de conta esquecida', p: 'Pagou? Um toque e pronto.' }],
    cam: [{ t: 0, s: 1.4, rx: 12, ry: 20, rz: -2 }, { t: 1.6, s: 1.5, rx: 10, ry: 26, rz: -3 }, { t: 1.9, sc: 0 }, { t: 2.7, sc: 560, ry: -8 }, { t: 4.6, s: 1.5, rx: 9, ry: -18, rz: 2 }],
    lift: [[0, .35, 2.0, 150], [1, .6, 2.1, 100], [2, 2.5, 6, 90], [3, 2.65, 6, 130], [4, 2.8, 6, 170], [5, 2.95, 6, 110]] },
  { pg: 'cartoes', ini: 17.6, fim: 22.4,
    leg: [{ a: 0, chip: 'Cartões', h: 'Fatura e limite na mão', p: 'Cada cartão, cada parcela, no dia certo.' }],
    cam: [{ t: 0, s: 1.4, rx: 10, ry: -20, rz: 1 }, { t: .9, s: 1.85, rx: 8, ry: -10, fx: 205, fy: 350, oy: 120 }, { t: 1.9, s: 1.82, rx: 6, ry: -6, fx: 210, fy: 380 },
      { t: 2.7, s: 1.42, rx: 10, ry: 14, fx: SW / 2, fy: SH / 2, sc: 0, oy: 0 }, { t: 3.4, sc: 1000 }, { t: 4.8, s: 1.5, rx: 8, ry: 20, rz: -1 }],
    lift: [[0, .25, 2.3, 170, 'giro'], [3, 1.6, 3.1, 90], [4, 1.7, 3.15, 140], [5, 1.8, 3.2, 120], [6, 1.9, 3.25, 170], [9, 3.2, 6, 150]] },
  { pg: 'dividas', ini: 22.4, fim: 27.6,
    leg: [{ a: 0, chip: 'Dívidas', h: 'Quanto falta pagar', p: 'Cada parcela paga te deixa mais perto.' }],
    cam: [{ t: 0, s: 1.4, rx: 12, ry: 18, rz: -1 }, { t: 1.4, s: 1.8, rx: 8, ry: 10, fy: 610, oy: 100 }, { t: 2.3, s: 1.75, fy: 620 },
      { t: 2.9, s: 1.42, rx: 10, ry: -14, fy: SH / 2, sc: 0, oy: 0 }, { t: 3.6, sc: 640 }, { t: 5.2, s: 1.5, rx: 8, ry: -20, rz: 1 }],
    lift: [[2, .3, 2.0, 120], [3, .4, 2.05, 180], [4, .5, 2.1, 90], [5, .6, 2.15, 150], [6, .9, 2.7, 170], [8, 3.4, 6, 150], [9, 3.6, 6, 100]] },
  { pg: 'metas', ini: 27.6, fim: 32.0,
    leg: [{ a: 0, chip: 'Metas', h: 'Potes que enchem', p: 'Cada meta enche conforme você guarda.' }],
    cam: [{ t: 0, s: 1.4, rx: 12, ry: -18, rz: 2 }, { t: 1.5, s: 1.5, rx: 10, ry: -24 }, { t: 1.8, sc: 0 }, { t: 2.5, sc: 560, ry: 6 }, { t: 4.4, s: 1.5, rx: 8, ry: 18, rz: -1 }],
    lift: [[0, .3, 1.9, 150], [1, .55, 2.0, 100], [2, 2.3, 6, 110], [3, 2.45, 6, 160], [4, 2.6, 6, 120]] },
  { pg: 'patrimonio', ini: 32.0, fim: 36.0,
    leg: [{ a: 0, chip: 'Dinheiro guardado', h: 'Tudo o que você tem', p: 'Banco por banco, num lugar só.' }],
    cam: [{ t: 0, s: 1.4, rx: 12, ry: 16, rz: -1 }, { t: 1.5, s: 1.5, rx: 10, ry: 22 }, { t: 1.8, sc: 0 }, { t: 2.5, sc: 480, ry: -6 }, { t: 4.0, s: 1.5, rx: 8, ry: -16, rz: 1 }],
    lift: [[1, .3, 2.0, 160], [2, .55, 2.05, 100], [3, 2.2, 6, 110], [4, 2.35, 6, 150], [5, 2.5, 6, 100]] },
  { pg: 'ano', ini: 36.0, fim: 45.0,
    leg: [{ a: 0, chip: 'Resumo do ano', h: 'O ano inteiro', p: 'Quanto entrou e quanto saiu em cada mês.' },
      { a: 3.6, chip: 'Resumo do ano', h: 'A linha da dívida', p: 'Acompanhe ela cair, mês a mês, até zerar.' },
      { a: 6.2, chip: 'Resumo do ano', h: 'Quanto sobrou', p: 'E quanto você acumulou no ano.' }],
    cam: [{ t: 0, s: 1.4, rx: 12, ry: -16, rz: 1 }, { t: 1.0, s: 1.45, rx: 14, ry: -22 }, { t: 2.1, s: 2.2, rx: 6, ry: 8, rz: 0, fy: 548, oy: 130 },
      { t: 3.4, s: 2.3, rx: 4, ry: 6, fy: 545 }, { t: 4.4, s: 2.6, rx: 6, ry: -6, fx: 230, fy: 465, oy: 160 }, { t: 5.6, s: 2.7, rx: 4, ry: -10, fx: 225, fy: 470 },
      { t: 6.0, sc: 0 }, { t: 6.8, s: 1.85, rx: 8, ry: 10, fx: SW / 2, fy: 612, sc: 640, oy: 90 }, { t: 9, s: 1.9, rx: 6, ry: 16 }],
    lift: [[0, .3, 1.9, 120], [1, .4, 1.95, 170], [2, .5, 2.0, 150], [3, .6, 2.05, 210], [4, 1.2, 6.3, 70], [6, 6.4, 12, 110]],
    revela: { 4: [1.5, 3.2], 6: [6.7, 8.2] } },
]
const GANCHO = [0, 3.6]
const FINAL = 45.0, TOTAL = 53.0

/* ───────────── Montagem ───────────── */
const orbes = ['oa', 'ob', 'oc'].map((i) => document.getElementById(i))
const grade = document.getElementById('grade')

function montarLegenda(l) {
  const d = el('div', 'legenda', palco)
  d.innerHTML = `<span class="chip">${l.chip}</span><h1>${l.h}</h1><p>${l.p}</p>`
  return d
}

const veu = el('div', 'veu', null)
CENAS.forEach((c) => {
  const meta = META[c.pg]
  c.f = camera(c.cam)
  c.dur = c.fim - c.ini
  c.tel = el('div', 'tel', palco)
  for (let k = 6; k >= 1; k--) el('div', 'chapa', c.tel, { transform: `translateZ(${-k * 2.4}px)`, background: `hsl(222 40% ${6 + k}%)` })
  c.base = el('div', 'base', c.tel, { backgroundImage: img(c.pg) })
  const revela = c.revela || {}
  c.cartas = meta.cards.map((r, i) => {
    const temRevela = revela[i] && meta.canvas.find((v) => v.y >= r.y && v.y < r.y + r.h)
    const e = el('div', 'carta', c.tel, { left: r.x + 'px', width: r.w + 'px', height: r.h + 'px',
      backgroundImage: img(temRevela ? c.pg + '_vazio' : c.pg), backgroundPosition: `${-r.x}px ${-r.y}px` })
    const carta = { r, e, lift: c.lift.find((l) => l[0] === i) }
    if (carta.lift && carta.lift[4] === 'giro') carta.brilho = el('i', 'brilho', e)
    if (temRevela) {
      const v = temRevela
      carta.revela = { janela: revela[i], e: el('div', 'revela', e, { left: v.x - r.x + 'px', top: v.y - r.y + 'px', width: v.w + 'px', height: v.h + 'px',
        backgroundImage: img(c.pg), backgroundPosition: `${-v.x}px ${-v.y}px` }) }
    }
    return carta
  })
  if (c.pg === 'ano') {
    // linha da dívida acendendo por cima do gráfico (pontos lidos da própria captura)
    const carta = c.cartas[4], r = carta.r
    const ns = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(ns, 'svg')
    svg.setAttribute('width', r.w); svg.setAttribute('height', r.h)
    svg.innerHTML = `<defs><filter id="luz" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>`
    const d = LINHA.map(([x, y], i) => `${i ? 'L' : 'M'}${(x - r.x).toFixed(1)} ${(y - r.y).toFixed(1)}`).join(' ')
    svg.innerHTML += `<path d="${d}" fill="none" stroke="#ffc24b" stroke-width="10" stroke-linecap="round" filter="url(#luz)" opacity=".9" pathLength="1" stroke-dasharray="1 1"/>
      <path d="${d}" fill="none" stroke="#ffe3a3" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>`
    carta.e.appendChild(svg)
    c.linha = [...svg.querySelectorAll('path')]
    c.etiqueta = el('div', 'etiqueta', c.tel, { left: '150px', top: '392px' })
    c.etiqueta.textContent = 'Dívidas ↘ caindo'
  }
  c.barra = el('div', 'peca', c.tel, { left: '16px', top: '0px', width: '398px', height: META[c.pg].barra.h + 'px', backgroundImage: img('barra') })
  c.fab = el('div', 'peca', c.tel, { left: '354px', top: '780px', width: '58px', height: '58px', backgroundImage: img('fab') })
  c.nav = el('div', 'peca', c.tel, { left: '14px', top: '856px', width: '402px', height: '64px', backgroundImage: img('nav_' + c.pg) })
})
palco.appendChild(veu)
CENAS.forEach((c) => { c.legendas = c.leg.map((l) => ({ ...l, e: montarLegenda(l) })) })

// gancho
const gancho = el('div', 'gancho', palco)
gancho.innerHTML = '<div>Pra onde foi</div><div>o seu dinheiro</div><div><span class="grad">esse mês?</span></div>'
const linhasGancho = [...gancho.children]

// final: as 8 telas num carrossel + marca
const anel = el('div', 'anel', palco)
const minis = CENAS.map((c, i) => {
  const m = el('div', 'mini', anel, { backgroundImage: img(c.pg) })
  el('i', '', m, { backgroundImage: img('nav_' + c.pg) })
  return m
})
const legFinal = montarLegenda({ chip: 'OpusCash', h: 'Tudo num lugar só', p: 'Seu dinheiro organizado, do jeito que deveria ser.' })
const fim = el('div', 'fim', palco)
fim.innerHTML = '<img src="cap/logo-opuscash.webp"><h2>Seu dinheiro, organizado.</h2><div class="cta">Teste grátis por 7 dias</div><div class="site">opuscash.com.br</div>'
const fimPartes = [...fim.children]

/* ───────────── Desenho de um quadro ───────────── */
const ultimo = new Map()
const por = (e, k, v) => { const id = e; let m = ultimo.get(id); if (!m) ultimo.set(id, (m = {})); if (m[k] !== v) { m[k] = v; e.style[k] = v } }
const mostrar = (e, sim) => por(e, 'display', sim ? '' : 'none')
const pesoLift = (l, t) => (l ? suave(l[1], l[1] + .5, t) * (1 - suave(l[2] - .5, l[2], t)) : 0)

function legenda(e, t, a, b) {
  const vis = t > a - .05 && t < b + .05
  mostrar(e, vis)
  if (!vis) return
  const ent = suave(a, a + .45, t), sai = suave(b - .3, b, t)
  const o = ent * (1 - sai)
  por(e, 'opacity', o.toFixed(3))
  por(e, 'transform', `translateY(${((1 - ent) * 50 - sai * 40).toFixed(1)}px)`)
  por(e, 'filter', o > .99 ? 'none' : `blur(${((1 - o) * 10).toFixed(1)}px)`)
}

function desenhar(T) {
  // fundo vivo
  por(orbes[0], 'transform', `translate(${(-300 + Math.sin(T * .35) * 160).toFixed(1)}px, ${(-250 + Math.cos(T * .27) * 140).toFixed(1)}px)`)
  por(orbes[1], 'transform', `translate(${(420 + Math.cos(T * .3) * 160).toFixed(1)}px, ${(1150 + Math.sin(T * .22) * 160).toFixed(1)}px)`)
  por(orbes[2], 'transform', `translate(${(250 + Math.sin(T * .25 + 2) * 220).toFixed(1)}px, ${(700 + Math.cos(T * .31) * 200).toFixed(1)}px)`)
  por(grade, 'backgroundPosition', `0 ${(T * 40).toFixed(1)}px`)

  // gancho
  const [g0, g1] = GANCHO
  mostrar(gancho, T < g1 + .2)
  linhasGancho.forEach((l, i) => {
    const a = .15 + i * .32, ent = suave(a, a + .55, T), sai = suave(g1 - .7 + i * .06, g1 - .05 + i * .06, T)
    por(l, 'transform', `translateY(${(-sai * 260).toFixed(1)}px) translateZ(${(sai * 300).toFixed(1)}px) rotateX(${((1 - ent) * -88).toFixed(1)}deg)`)
    por(l, 'opacity', (ent * (1 - sai)).toFixed(3))
  })

  // telas
  CENAS.forEach((c, ci) => {
    const t = T - c.ini, vis = t > -.45 && t < c.dur + .45 && T < FINAL + .5
    mostrar(c.tel, vis)
    c.legendas.forEach((l, k) => legenda(l.e, t, l.a + (k === 0 ? .1 : 0), k + 1 < c.legendas.length ? c.legendas[k + 1].a : c.dur - .05))
    if (!vis) return
    const q = c.f(t)
    // balanço leve e contínuo, para a tela nunca parecer congelada
    const rx = q.rx + Math.sin(T * 1.1) * 1.2, ry = q.ry + Math.cos(T * .9) * 1.6
    // entrada e saída em carrossel: chega pela direita girando e sai pela esquerda
    const u = suave(-.45, .4, t), e = suave(c.dur - .4, c.dur + .45, t)
    let pre
    if (c.entrada === 'baixo') pre = `translate3d(0, ${((1 - u) * 1500).toFixed(1)}px, ${(-(1 - u) * 300).toFixed(1)}px) rotateX(${((1 - u) * 30).toFixed(2)}deg)`
    else pre = `translate3d(${((1 - u) * 1150).toFixed(1)}px, 0, ${(-(1 - u) * 500).toFixed(1)}px) rotateY(${((1 - u) * 62).toFixed(2)}deg)`
    if (ci === CENAS.length - 1) pre += ` translate3d(0, 0, ${(-e * 1400).toFixed(1)}px) rotateX(${(e * 25).toFixed(2)}deg)`
    else pre += ` translate3d(${(-e * 1150).toFixed(1)}px, 0, ${(-e * 500).toFixed(1)}px) rotateY(${(-e * 62).toFixed(2)}deg)`
    por(c.tel, 'transform', `translate(${CX}px, ${(CY + q.oy).toFixed(1)}px) ${pre} scale3d(${q.s.toFixed(4)}, ${q.s.toFixed(4)}, ${q.s.toFixed(4)}) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${q.rz.toFixed(2)}deg) translate(${(-q.fx).toFixed(1)}px, ${(-q.fy).toFixed(1)}px)`)
    por(c.tel, 'opacity', (ci === CENAS.length - 1 ? 1 - e : 1).toFixed(3))
    const sc = q.sc
    por(c.base, 'backgroundPosition', `0 ${(-sc).toFixed(1)}px`)

    let maxPeso = 0
    c.cartas.forEach((k) => {
      const { r } = k, y0 = r.y - sc
      const dentro = y0 + r.h > TOPO + 2 && y0 < SH - 2
      mostrar(k.e, dentro)
      if (!dentro) return
      por(k.e, 'top', y0.toFixed(1) + 'px')
      const it = Math.max(0, TOPO - y0), ib = Math.max(0, y0 + r.h - SH)
      por(k.e, 'clipPath', it || ib ? `inset(${it.toFixed(1)}px 0 ${ib.toFixed(1)}px 0 round 18px)` : 'none')
      const w = pesoLift(k.lift, t)
      maxPeso = Math.max(maxPeso, w)
      let extra = ''
      if (k.lift && k.lift[4] === 'giro') {
        const g = rampa(k.lift[1], k.lift[2], t)
        extra = ` rotateX(${(Math.sin(g * Math.PI) * 14).toFixed(2)}deg) rotateY(${(Math.sin(g * Math.PI * 2) * -24).toFixed(2)}deg)`
        por(k.brilho, 'transform', `translateX(${mistura(-140, 260, suave(k.lift[1] + .3, k.lift[1] + 1.3, t)).toFixed(1)}%) skewX(-18deg)`)
      }
      const z = (k.lift ? k.lift[3] : 0) * w
      por(k.e, 'transform', `translate3d(0, 0, ${z.toFixed(1)}px) scale(${(1 + .03 * w).toFixed(4)})${extra}`)
      por(k.e, 'boxShadow', w > .01 ? `0 ${(30 * w).toFixed(1)}px ${(70 * w).toFixed(1)}px rgba(0,0,0,${(.55 * w).toFixed(2)}), 0 0 0 1px rgba(148,163,196,${(.3 * w).toFixed(2)})` : 'none')
      if (k.revela) {
        const [a, b] = k.revela.janela, v = suave(a, b, t)
        por(k.revela.e, 'clipPath', `inset(0 ${((1 - v) * 100).toFixed(2)}% 0 0)`)
      }
    })
    por(c.base, 'filter', `brightness(${(1 - .5 * maxPeso).toFixed(3)})`)
    // peças fixas do app: a barra de cima, o botão + e as abas de baixo
    por(c.barra, 'transform', 'translateZ(3px)')
    por(c.fab, 'transform', `translateZ(${(14 + 60 * maxPeso).toFixed(1)}px)`)
    por(c.nav, 'transform', `translateZ(${(10 + 40 * maxPeso).toFixed(1)}px)`)
    if (c.linha) {
      const d = suave(3.6, 5.2, t), sai = suave(6.0, 6.5, t)
      c.linha.forEach((p) => { p.setAttribute('stroke-dashoffset', (1 - d).toFixed(4)); p.setAttribute('opacity', ((p === c.linha[0] ? .9 : 1) * (1 - sai)).toFixed(3)) })
      const et = suave(4.4, 4.9, t) * (1 - sai)
      mostrar(c.etiqueta, et > .001)
      por(c.etiqueta, 'opacity', et.toFixed(3))
      por(c.etiqueta, 'transform', `translateZ(${(150 * et).toFixed(1)}px) scale(${(.6 + .4 * et).toFixed(3)})`)
    }
  })

  // final
  const tf = T - FINAL
  mostrar(anel, tf > -.6)
  if (tf > -.6) {
    const ent = suave(-.6, .9, tf), rec = suave(3.4, 4.6, tf)
    const giro = -20 - tf * 52
    por(anel, 'transform', `translate3d(0, ${(rec * 330).toFixed(1)}px, ${(-1800 * (1 - ent) - 600 - rec * 900).toFixed(1)}px) rotateX(${(-8 + rec * 14).toFixed(2)}deg) rotateY(${giro.toFixed(2)}deg)`)
    por(anel, 'opacity', (ent * (1 - .78 * rec)).toFixed(3))
    minis.forEach((m, i) => {
      const ang = i * 45, a = ((ang + giro) % 360 + 360) % 360, frente = (Math.cos(a * Math.PI / 180) + 1) / 2
      por(m, 'transform', `rotateY(${ang}deg) translateZ(820px)`)
      por(m, 'filter', `brightness(${(.35 + .65 * frente).toFixed(3)})`)
    })
  }
  legenda(legFinal, tf, .2, 3.5)
  mostrar(fim, tf > 3.3)
  fimPartes.forEach((p, i) => {
    const a = 3.6 + i * .3, v = suave(a, a + .6, tf)
    por(p, 'opacity', v.toFixed(3))
    por(p, 'transform', `translateY(${((1 - v) * 60).toFixed(1)}px) scale(${(.85 + .15 * v).toFixed(3)})` + (i === 2 ? ` scale(${(1 + Math.sin(Math.max(0, tf - 4.8) * 4.5) * .025 * v).toFixed(4)})` : ''))
  })
}
window.desenhar = desenhar
window.TOTAL = TOTAL
window.pronto = Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => document.fonts.ready)
desenhar(Number(new URLSearchParams(location.search).get('t') || 0))
</script>
</body>
